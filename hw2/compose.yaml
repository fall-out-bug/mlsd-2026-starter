services:
  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["mini", "-dir=/data", "-ip=127.0.0.1", "-ip.bind=0.0.0.0", "-s3.port=8333", "-volume.max=2", "-master.volumeSizeLimitMB=64", "-master.telemetry=false", "-webdav=false", "-admin.ui=false", "-s3.port.iceberg=0", "-s3.port.lance=0"]
    environment:
      AWS_ACCESS_KEY_ID: hw2-local
      AWS_SECRET_ACCESS_KEY: hw2-local-only
    mem_limit: 512m
  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  pipeline:
    build:
      context: .
      args:
        STUDENT_UID: "${LOCAL_UID:-1000}"
        STUDENT_GID: "${LOCAL_GID:-1000}"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    mem_limit: 4g
    cpus: 2
    environment:
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: hw2-local
      S3_SECRET_KEY: hw2-local-only
      REDIS_HOST: redis
    volumes:
      - .:/workspace
    depends_on:
      redis:
        condition: service_healthy
      s3:
        condition: service_started
    command: ["python", "run.py"]
